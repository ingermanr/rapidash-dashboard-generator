<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="cover-title cover-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="cover-title">Rapidash</title>
  <desc id="cover-desc">A dashboard layout generated by Rapidash: four KPI cards, a bar chart, a trend line, a donut and a ranking, colored with the Aurora palette.</desc>

  <!-- Page -->
  <rect width="1200" height="660" rx="24" fill="#f4f6fb"/>

  <!-- Header -->
  <g transform="translate(40 32)">
    <svg width="44" height="44" viewBox="0 0 256 256">
      <rect width="256" height="256" rx="56" fill="#0054ee"/>
      <rect x="48" y="48" width="160" height="44" rx="12" fill="#ffffff"/>
      <rect x="48" y="108" width="92" height="100" rx="12" fill="#ffffff"/>
      <rect x="64" y="166" width="14" height="26" rx="3" fill="#0054ee"/>
      <rect x="87" y="146" width="14" height="46" rx="3" fill="#0054ee"/>
      <rect x="110" y="124" width="14" height="68" rx="3" fill="#0054ee"/>
      <rect x="156" y="108" width="52" height="42" rx="12" fill="#ffffff"/>
      <rect x="156" y="166" width="52" height="42" rx="12" fill="#ffffff" fill-opacity="0.7"/>
    </svg>
    <text x="60" y="20" font-size="20" font-weight="700" fill="#0f172a">Ventas Q1</text>
    <text x="60" y="40" font-size="13" fill="#64748b">Asymmetric · paleta Aurora · 7 componentes</text>
    <rect x="896" y="6" width="112" height="34" rx="8" fill="#ffffff" stroke="#d6dbe6"/>
    <text x="952" y="28" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Compartir</text>
    <rect x="1016" y="6" width="104" height="34" rx="8" fill="#0054ee"/>
    <text x="1068" y="28" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Exportar PDF</text>
  </g>

  <!-- KPI row -->
  <g font-size="13" fill="#64748b">
    <g transform="translate(40 104)">
      <rect width="266" height="96" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
      <rect x="0" y="16" width="4" height="64" rx="2" fill="#8b5cf6"/>
      <text x="22" y="34">Ventas</text>
      <text x="22" y="72" font-size="30" font-weight="700" fill="#0f172a">$ 1,28 M</text>
    </g>
    <g transform="translate(324 104)">
      <rect width="266" height="96" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
      <rect x="0" y="16" width="4" height="64" rx="2" fill="#0d9488"/>
      <text x="22" y="34">Clientes activos</text>
      <text x="22" y="72" font-size="30" font-weight="700" fill="#0f172a">4.812</text>
    </g>
    <g transform="translate(608 104)">
      <rect width="266" height="96" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
      <rect x="0" y="16" width="4" height="64" rx="2" fill="#ec4899"/>
      <text x="22" y="34">Conversión</text>
      <text x="22" y="72" font-size="30" font-weight="700" fill="#0f172a">3,9 %</text>
    </g>
    <g transform="translate(892 104)">
      <rect width="268" height="96" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
      <rect x="0" y="16" width="4" height="64" rx="2" fill="#3b82f6"/>
      <text x="22" y="34">Ticket medio</text>
      <text x="22" y="72" font-size="30" font-weight="700" fill="#0f172a">$ 266</text>
    </g>
  </g>

  <!-- Bar chart: Ventas por región -->
  <g transform="translate(40 218)">
    <rect width="550" height="250" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
    <text x="22" y="34" font-size="15" font-weight="600" fill="#0f172a">Ventas por región</text>
    <g stroke="#eef1f6">
      <line x1="22" y1="80" x2="528" y2="80"/>
      <line x1="22" y1="130" x2="528" y2="130"/>
      <line x1="22" y1="180" x2="528" y2="180"/>
    </g>
    <line x1="22" y1="220" x2="528" y2="220" stroke="#d6dbe6"/>
    <g fill="#8b5cf6">
      <rect x="44" y="96" width="52" height="124" rx="6"/>
      <rect x="128" y="132" width="52" height="88" rx="6"/>
      <rect x="212" y="74" width="52" height="146" rx="6"/>
      <rect x="296" y="150" width="52" height="70" rx="6"/>
      <rect x="380" y="112" width="52" height="108" rx="6"/>
      <rect x="464" y="166" width="52" height="54" rx="6"/>
    </g>
  </g>

  <!-- Line chart: Tendencia mensual -->
  <g transform="translate(608 218)">
    <rect width="552" height="250" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
    <text x="22" y="34" font-size="15" font-weight="600" fill="#0f172a">Tendencia mensual</text>
    <g stroke="#eef1f6">
      <line x1="22" y1="80" x2="530" y2="80"/>
      <line x1="22" y1="130" x2="530" y2="130"/>
      <line x1="22" y1="180" x2="530" y2="180"/>
    </g>
    <line x1="22" y1="220" x2="530" y2="220" stroke="#d6dbe6"/>
    <path d="M30 196 L102 180 L174 188 L246 150 L318 158 L390 118 L462 104 L522 76 L522 220 L30 220 Z" fill="#0d9488" fill-opacity="0.12"/>
    <path d="M30 196 L102 180 L174 188 L246 150 L318 158 L390 118 L462 104 L522 76" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="522" cy="76" r="6" fill="#0d9488"/>
  </g>

  <!-- Donut: Canal -->
  <g transform="translate(40 486)">
    <rect width="550" height="146" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
    <text x="22" y="34" font-size="15" font-weight="600" fill="#0f172a">Ventas por canal</text>
    <g transform="translate(440 76)" fill="none" stroke-width="18">
      <circle r="44" stroke="#ec4899" stroke-dasharray="124 400" transform="rotate(-90)"/>
      <circle r="44" stroke="#3b82f6" stroke-dasharray="83 400" stroke-dashoffset="-124" transform="rotate(-90)"/>
      <circle r="44" stroke="#b45309" stroke-dasharray="69.5 400" stroke-dashoffset="-207" transform="rotate(-90)"/>
    </g>
    <g font-size="13" fill="#334155">
      <rect x="22" y="58" width="12" height="12" rx="3" fill="#ec4899"/><text x="42" y="69">Online · 45 %</text>
      <rect x="22" y="82" width="12" height="12" rx="3" fill="#3b82f6"/><text x="42" y="93">Tiendas · 30 %</text>
      <rect x="22" y="106" width="12" height="12" rx="3" fill="#b45309"/><text x="42" y="117">Mayoristas · 25 %</text>
    </g>
  </g>

  <!-- Horizontal bars: Top productos -->
  <g transform="translate(608 486)">
    <rect width="552" height="146" rx="14" fill="#ffffff" stroke="#e2e6ef"/>
    <text x="22" y="34" font-size="15" font-weight="600" fill="#0f172a">Top productos</text>
    <g font-size="13" fill="#334155">
      <text x="22" y="66">Línea A</text><rect x="110" y="55" width="400" height="14" rx="7" fill="#3b82f6"/>
      <text x="22" y="94">Línea B</text><rect x="110" y="83" width="290" height="14" rx="7" fill="#3b82f6" fill-opacity="0.8"/>
      <text x="22" y="122">Línea C</text><rect x="110" y="111" width="190" height="14" rx="7" fill="#3b82f6" fill-opacity="0.6"/>
    </g>
  </g>
</svg>
